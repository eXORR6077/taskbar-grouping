name: CodeQL

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: windows-latest
    # An explicit permissions block zeroes every unlisted scope. contents:read is
    # required for checkout on a private repo (its absence failed every scheduled run
    # with "repository not found"); actions:read is required by codeql-action on
    # private repos to query workflow metadata.
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # The job builds explicitly below; without this the action expects an
          # autobuild step and can fail with "no source code seen during the build".
          build-mode: manual

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release

      # upload:never — code-scanning upload requires GitHub Advanced Security, which is
      # not available for private repos on this plan (upload fails with "Code scanning is
      # not enabled for this repository"). Findings are surfaced by the summary step below
      # (fails the job) and the SARIF artifact instead. If the repo goes public or GHAS is
      # purchased, drop upload/output and the two steps below to restore native upload.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      - name: Report findings
        shell: pwsh
        run: |
          $total = 0
          Get-ChildItem codeql-results -Filter *.sarif | ForEach-Object {
            $data = Get-Content $_.FullName -Raw | ConvertFrom-Json
            foreach ($run in $data.runs) {
              foreach ($r in $run.results) {
                $total++
                $loc = $r.locations[0].physicalLocation
                Write-Host ("::warning::CodeQL: {0} ({1}:{2})" -f $r.message.text, $loc.artifactLocation.uri, $loc.region.startLine)
              }
            }
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "CodeQL findings: $total"
          if ($total -gt 0) { exit 1 }

      - name: Upload SARIF artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 7
