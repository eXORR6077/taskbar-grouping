name: CodeQL

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: windows-latest
    # An explicit permissions block zeroes every unlisted scope. contents:read is
    # required for checkout on a private repo (its absence failed every scheduled run
    # with "repository not found"); actions:read is required by codeql-action on
    # private repos to query workflow metadata.
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # The job builds explicitly below; without this the action expects an
          # autobuild step and can fail with "no source code seen during the build".
          build-mode: manual

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
