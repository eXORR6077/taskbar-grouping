name: CI

on:
  push:
    branches: [develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskbarFolders.sln

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskbarFolders.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Check formatting
        run: dotnet format TaskbarFolders.sln --verify-no-changes --verbosity diagnostic

      # retention-days on all uploads: the account artifact-storage quota filled up and
      # every upload step failed with "Artifact storage quota has been hit" (the 90-day
      # default kept ~180 MB of bin trees per run alive for three months).
      - name: Upload raw coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Generate coverage HTML + summary
        if: always()
        shell: pwsh
        run: |
          # Tool version pinned in .config/dotnet-tools.json so CI can't silently drift.
          dotnet tool restore
          dotnet reportgenerator `
            -reports:./TestResults/**/coverage.cobertura.xml `
            -targetdir:./TestResults/CoverageReport `
            -reporttypes:"Html;TextSummary"
          Write-Host "----- Coverage summary -----"
          Get-Content ./TestResults/CoverageReport/Summary.txt

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          retention-days: 7

      # The two Release bin trees are the quota hog; dependabot PRs never need them.
      - name: Upload build artifacts
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/TaskbarFolders.Manager/bin/Release/
            src/TaskbarFolders.Launcher/bin/Release/
          retention-days: 3
