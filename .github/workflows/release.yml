name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      # softprops/action-gh-release needs contents:write to create a release;
      # the default GITHUB_TOKEN only has contents:read, which is why the first
      # full pipeline run failed with "Resource not accessible by integration".
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskbarFolders.sln

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskbarFolders.sln --configuration Release --no-build

      - name: Publish Manager (self-contained)
        run: dotnet publish src/TaskbarFolders.Manager/TaskbarFolders.Manager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/Manager

      - name: Publish Launcher (self-contained)
        run: dotnet publish src/TaskbarFolders.Launcher/TaskbarFolders.Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/Launcher

      - name: Create portable ZIP
        run: Compress-Archive -Path ./publish/* -DestinationPath ./TaskbarFolders-portable.zip

      - name: Build Inno Setup installer
        shell: pwsh
        # Inno Setup 6 is pre-installed on windows-latest runners; using the system iscc
        # avoids depending on third-party GitHub Actions (the previous jrsoftware/iscc-action
        # is no longer published, which is why v0.1.0 and the first v0.2.0 attempt failed).
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc — runner image change suspected; check https://github.com/actions/runner-images for the current Inno Setup install path."
          }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            ./TaskbarFolders-portable.zip
            ./installer/Output/TaskbarFolders-Setup.exe
